<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c9df" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#e6d4b8" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#f3e8d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f7f1e7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8f78" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#556b54" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f7a5a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a5238" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6646" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#243522" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="namaW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef9" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#efe8d8" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Far range — Tirumala silhouette -->
  <path fill="url(#hillFar)" d="M0 480
    C60 450 120 400 200 385
    C280 370 340 410 420 390
    C500 370 560 320 650 330
    C740 340 800 385 880 365
    C960 345 1020 300 1120 315
    C1220 330 1280 370 1360 355
    C1440 340 1520 375 1600 400
    L1600 900 L0 900 Z"/>

  <!-- Mid peaks (main Tirumala massif feel) -->
  <path fill="url(#hillMid)" d="M0 560
    C90 520 160 470 260 455
    C350 442 410 490 500 465
    C590 440 650 390 740 400
    C830 410 890 460 980 440
    C1070 420 1130 370 1220 385
    C1310 400 1380 450 1480 435
    C1540 428 1580 450 1600 465
    L1600 900 L0 900 Z"/>

  <!-- Near foothills -->
  <path fill="url(#hillNear)" d="M0 640
    C110 600 200 555 320 545
    C440 535 520 585 640 565
    C760 545 840 500 950 515
    C1060 530 1140 575 1260 560
    C1380 545 1480 580 1600 600
    L1600 900 L0 900 Z"/>

  <!-- Ridge detail lines -->
  <g stroke="#2c3f2a" stroke-opacity="0.12" stroke-width="1.2" fill="none">
    <path d="M40 560 C200 520 360 540 520 500 C680 460 840 510 1000 480 C1160 450 1320 500 1560 470"/>
    <path d="M0 620 C180 580 360 600 540 570 C720 540 900 590 1080 560 C1260 530 1440 570 1600 550"/>
  </g>

  <!-- Sacred Namams — abundant, Tirumala-style white U marks -->
  <g fill="url(#namaW)">
    <!-- Large central nama (iconic) -->
    <g transform="translate(700,390)">
      <path d="M0 0 L12 95 L28 95 L16 0 Z"/>
      <path d="M52 0 L40 95 L56 95 L68 0 Z"/>
      <path d="M12 88 Q34 112 56 88 L54 98 Q34 118 14 98 Z"/>
      <path d="M30 8 L34 88" stroke="#9c2f2f" stroke-opacity="0.45" stroke-width="3" fill="none"/>
    </g>

    <!-- Left slope cluster -->
    <g transform="translate(180,450) scale(0.72)">
      <path d="M0 0 L12 95 L28 95 L16 0 Z"/>
      <path d="M52 0 L40 95 L56 95 L68 0 Z"/>
      <path d="M12 88 Q34 112 56 88 L54 98 Q34 118 14 98 Z"/>
      <path d="M30 10 L34 86" stroke="#9c2f2f" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(280,480) scale(0.5)">
      <path d="M0 0 L10 80 L24 80 L14 0 Z"/>
      <path d="M44 0 L34 80 L48 80 L58 0 Z"/>
      <path d="M10 74 Q29 94 48 74"/>
