    <g transform="translate(380,430) scale(0.58)">
      <path d="M0 0 L11 88 L25 88 L14 0 Z"/>
      <path d="M48 0 L37 88 L51 88 L62 0 Z"/>
      <path d="M11 82 Q31 104 51 82"/>
      <path d="M28 8 L32 80" stroke="#9c2f2f" stroke-opacity="0.3" stroke-width="2" fill="none"/>
    </g>

    <!-- Mid-left ridge -->
    <g transform="translate(480,420) scale(0.65)">
      <path d="M0 0 L12 92 L26 92 L14 0 Z"/>
      <path d="M50 0 L38 92 L52 92 L64 0 Z"/>
      <path d="M12 86 Q32 108 52 86"/>
    </g>
    <g transform="translate(560,470) scale(0.42)">
      <path d="M0 0 L9 72 L20 72 L11 0 Z"/>
      <path d="M38 0 L29 72 L40 72 L49 0 Z"/>
