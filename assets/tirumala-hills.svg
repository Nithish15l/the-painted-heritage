    </g>

    <!-- Right of center -->
    <g transform="translate(900,400) scale(0.68)">
      <path d="M0 0 L12 94 L27 94 L15 0 Z"/>
      <path d="M52 0 L40 94 L55 94 L67 0 Z"/>
      <path d="M12 88 Q33 112 55 88"/>
      <path d="M30 8 L34 86" stroke="#9c2f2f" stroke-opacity="0.4" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(1000,450) scale(0.48)">
      <path d="M0 0 L10 78 L22 78 L12 0 Z"/>
      <path d="M42 0 L32 78 L44 78 L54 0 Z"/>
      <path d="M10 72 Q27 92 44 72"/>
    </g>

    <!-- Far right slopes -->
    <g transform="translate(1180,415) scale(0.7)">
      <path d="M0 0 L12 96 L27 96 L15 0 Z"/>
      <path d="M52 0 L40 96 L55 96 L67 0 Z"/>
      <path d="M12 90 Q33 114 55 90"/>
      <path d="M30 6 L34 88" stroke="#9c2f2f" stroke-opacity="0.38" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(1300,460) scale(0.52)">
      <path d="M0 0 L10 82 L23 82 L13 0 Z"/>
      <path d="M44 0 L34 82 L47 82 L57 0 Z"/>
      <path d="M10 76 Q28 96 47 76"/>
