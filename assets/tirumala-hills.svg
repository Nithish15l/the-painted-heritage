    <g transform="translate(1420,490) scale(0.4)">
      <path d="M0 0 L9 70 L20 70 L11 0 Z"/>
      <path d="M38 0 L29 70 L40 70 L49 0 Z"/>
      <path d="M9 66 Q24 84 40 66"/>
    </g>

    <!-- Scattered small namas -->
    <g transform="translate(640,500) scale(0.35)" opacity="0.9">
      <path d="M0 0 L8 60 L18 60 L10 0 Z"/>
      <path d="M34 0 L26 60 L36 60 L44 0 Z"/>
      <path d="M8 56 Q22 72 36 56"/>
    </g>
    <g transform="translate(820,510) scale(0.32)" opacity="0.85">
      <path d="M0 0 L8 58 L17 58 L9 0 Z"/>
      <path d="M32 0 L24 58 L33 58 L41 0 Z"/>
      <path d="M8 54 Q20 68 33 54"/>
    </g>
    <g transform="translate(1080,500) scale(0.36)" opacity="0.88">
      <path d="M0 0 L8 62 L18 62 L10 0 Z"/>
      <path d="M34 0 L26 62 L36 62 L44 0 Z"/>
      <path d="M8 58 Q22 74 36 58"/>
    </g>
  </g>

  <!-- Kalahasti Shiva Tripundra on lower slopes -->
  <g opacity="0.7">
    <g transform="translate(520,520)">
      <rect x="0" y="0" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="12" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="24" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <circle cx="35" cy="15.5" r="4.5" fill="#9c2f2f" fill-opacity="0.65"/>
    </g>
    <g transform="translate(980,500)">
      <rect x="0" y="0" width="62" height="6" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="11" width="62" height="6" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="22" width="62" height="6" rx="2" fill="#f2ebe0"/>
      <circle cx="31" cy="14" r="4" fill="#9c2f2f" fill-opacity="0.65"/>
    </g>
    <g transform="translate(220,540) scale(0.85)">
      <rect x="0" y="0" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="12" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="24" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <circle cx="35" cy="15.5" r="4.5" fill="#9c2f2f" fill-opacity="0.6"/>
    </g>
    <g transform="translate(1280,530) scale(0.8)">
      <rect x="0" y="0" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="12" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <rect x="0" y="24" width="70" height="7" rx="2" fill="#f2ebe0"/>
      <circle cx="35" cy="15.5" r="4.5" fill="#9c2f2f" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- Soft forest dots on ridges -->
  <g fill="#1e2e1c" opacity="0.18">
    <ellipse cx="150" cy="545" rx="16" ry="26"/>
    <ellipse cx="320" cy="530" rx="12" ry="20"/>
    <ellipse cx="540" cy="510" rx="14" ry="22"/>
    <ellipse cx="780" cy="490" rx="18" ry="28"/>
    <ellipse cx="1050" cy="505" rx="15" ry="24"/>
    <ellipse cx="1250" cy="520" rx="17" ry="27"/>
    <ellipse cx="1480" cy="545" rx="13" ry="21"/>
  </g>

  <!-- Parchment blend at base -->
  <path fill="#f7f1e7" fill-opacity="0.35" d="M0 720 Q400 680 800 705 T1600 720 L1600 900 L0 900 Z"/>
  <path fill="#f7f1e7" fill-opacity="0.55" d="M0 780 Q500 750 1000 770 T1600 780 L1600 900 L0 900 Z"/>
  <path fill="#f7f1e7" fill-opacity="0.78" d="M0 840 Q600 820 1200 835 T1600 840 L1600 900 L0 900 Z"/>
</svg>
