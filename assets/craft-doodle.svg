<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Original atelier doodle for craft panel: pen, tree, namas, border -->
  <rect x="16" y="16" width="368" height="448" rx="12" stroke="#c9a227" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="32" y="32" width="336" height="416" rx="8" stroke="#9c2f2f" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Tree of life -->
  <g stroke="#e8d48b" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M200 380 V200"/>
    <path d="M200 320 C150 300 120 260 110 220"/>
    <path d="M200 320 C250 300 280 260 290 220"/>
    <path d="M200 270 C160 250 140 210 135 175"/>
    <path d="M200 270 C240 250 260 210 265 175"/>
    <path d="M200 230 C180 200 170 170 168 145"/>
    <path d="M200 230 C220 200 230 170 232 145"/>
    <ellipse cx="200" cy="145" rx="72" ry="55"/>
    <ellipse cx="200" cy="140" rx="48" ry="38"/>
    <circle cx="200" cy="132" r="12" fill="#c9a227" fill-opacity="0.35" stroke="#e8d48b"/>
  </g>

  <!-- Paisley leaves -->
  <g fill="#9c2f2f" fill-opacity="0.35" stroke="#e8d48b" stroke-width="0.8">
    <path d="M145 175 C130 155 138 135 158 140 C162 155 155 170 145 175Z"/>
    <path d="M255 175 C270 155 262 135 242 140 C238 155 245 170 255 175Z"/>
    <path d="M120 250 C105 230 112 210 132 216 C138 232 130 246 120 250Z"/>
    <path d="M280 250 C295 230 288 210 268 216 C262 232 270 246 280 250Z"/>
  </g>

  <!-- Kalam pen -->
  <g transform="translate(70,300) rotate(-28)" stroke="#e8d48b" stroke-width="1.3" fill="none">
    <path d="M0 40 L80 40" stroke-width="2"/>
    <path d="M80 40 L100 36 L100 44 Z" fill="#c9a227" fill-opacity="0.5"/>
    <rect x="10" y="34" width="28" height="12" rx="2" fill="#9c2f2f" fill-opacity="0.4" stroke="#e8d48b"/>
  </g>

  <!-- Tirumala namam -->
  <g transform="translate(300,300)" opacity="0.85">
    <path d="M4 0 L8 42 L16 42 L12 0 Z" fill="#f7f3ea"/>
    <path d="M36 0 L32 42 L40 42 L44 0 Z" fill="#f7f3ea"/>
    <path d="M8 38 Q24 50 40 38 L38 44 Q24 54 10 44 Z" fill="#f7f3ea"/>
    <path d="M22 2 L24 40" stroke="#9c2f2f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Shiva tripundra -->
  <g transform="translate(290,370)" opacity="0.85">
    <rect x="0" y="0" width="52" height="5" rx="1.5" fill="#f2ebe0"/>
    <rect x="0" y="10" width="52" height="5" rx="1.5" fill="#f2ebe0"/>
    <rect x="0" y="20" width="52" height="5" rx="1.5" fill="#f2ebe0"/>
    <circle cx="26" cy="12.5" r="3.5" fill="#9c2f2f"/>
  </g>

  <!-- Corner dots -->
  <g fill="#c9a227" fill-opacity="0.5">
    <circle cx="48" cy="48" r="3"/>
    <circle cx="352" cy="48" r="3"/>
    <circle cx="48" cy="432" r="3"/>
    <circle cx="352" cy="432" r="3"/>
  </g>

  <text x="200" y="420" text-anchor="middle" fill="#e8d48b" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.9">Drawn by hand</text>
</svg>
