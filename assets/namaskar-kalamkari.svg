<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Namaskar">
  <!-- Kalamkari-style Namaskar: ornate border + figure in prayer -->
  <defs>
    <linearGradient id="nkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfc07a"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>
    <linearGradient id="nkSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d4b0"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <linearGradient id="nkSari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a63d3d"/>
      <stop offset="100%" stop-color="#6e2424"/>
    </linearGradient>
  </defs>

  <!-- Outer medallion -->
  <circle cx="80" cy="80" r="74" stroke="url(#nkGold)" stroke-width="1.5" opacity="0.9"/>
  <circle cx="80" cy="80" r="68" stroke="#a63d3d" stroke-width="0.9" opacity="0.45"/>
  <circle cx="80" cy="80" r="62" stroke="url(#nkGold)" stroke-width="0.7" opacity="0.35" stroke-dasharray="2 3"/>

  <!-- Corner paisley dots -->
  <g fill="#dfc07a" opacity="0.55">
    <circle cx="80" cy="12" r="2.2"/>
    <circle cx="80" cy="148" r="2.2"/>
    <circle cx="12" cy="80" r="2.2"/>
    <circle cx="148" cy="80" r="2.2"/>
  </g>

  <!-- Lotus petals under figure -->
  <g stroke="#c4a35a" stroke-width="1" fill="none" opacity="0.55">
    <ellipse cx="80" cy="128" rx="28" ry="8"/>
    <path d="M58 126c6-10 14-14 22-14s16 4 22 14"/>
  </g>

  <!-- Head -->
  <circle cx="80" cy="48" r="14" fill="url(#nkSkin)" stroke="#c4a35a" stroke-width="1.2"/>
  <!-- Hair / bun -->
  <path d="M66 46c0-12 6-18 14-18s14 6 14 18c-4-6-10-8-14-8s-10 2-14 8z" fill="#162338" opacity="0.9"/>
  <circle cx="80" cy="30" r="4" fill="#162338"/>
  <circle cx="80" cy="30" r="2" fill="#dfc07a" opacity="0.7"/>
  <!-- Tilak / namam hint -->
  <path d="M80 42v8" stroke="#a63d3d" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M77 44h6" stroke="#a63d3d" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Eyes soft -->
  <circle cx="75" cy="48" r="1.1" fill="#162338"/>
  <circle cx="85" cy="48" r="1.1" fill="#162338"/>
  <path d="M76 54c1.5 1.5 6.5 1.5 8 0" stroke="#6e2424" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>

  <!-- Shoulders / upper sari -->
  <path d="M48 78c6-14 18-22 32-22s26 8 32 22v8c-8-10-20-14-32-14s-24 4-32 14v-8z" fill="url(#nkSari)" stroke="#c4a35a" stroke-width="1"/>
  <!-- Gold border on sari -->
  <path d="M50 82c8-10 18-14 30-14s22 4 30 14" stroke="#dfc07a" stroke-width="1.2" fill="none" opacity="0.75"/>

  <!-- Arms in namaskar (prayer) -->
  <path d="M58 78c-2 8 2 16 10 22 4 3 8 5 12 6" stroke="url(#nkSkin)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M102 78c2 8-2 16-10 22-4 3-8 5-12 6" stroke="url(#nkSkin)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Hands pressed together -->
  <ellipse cx="80" cy="104" rx="7" ry="9" fill="url(#nkSkin)" stroke="#c4a35a" stroke-width="1"/>
  <path d="M80 96v15" stroke="#a63d3d" stroke-width="0.8" opacity="0.35"/>

  <!-- Sleeve ornaments -->
  <circle cx="60" cy="90" r="2" fill="#dfc07a" opacity="0.8"/>
  <circle cx="100" cy="90" r="2" fill="#dfc07a" opacity="0.8"/>

  <!-- Body / lower drape -->
  <path d="M56 90c4 18 10 28 24 34 14-6 20-16 24-34-8 6-16 8-24 8s-16-2-24-8z" fill="url(#nkSari)" stroke="#c4a35a" stroke-width="1" opacity="0.95"/>
  <path d="M64 100c5 8 10 12 16 14 6-2 11-6 16-14" stroke="#dfc07a" stroke-width="0.9" fill="none" opacity="0.5"/>

  <!-- Kalamkari vine flourishes left/right -->
  <g stroke="#c4a35a" stroke-width="1" fill="none" opacity="0.5">
    <path d="M28 70c6 4 8 12 6 18"/>
    <path d="M132 70c-6 4-8 12-6 18"/>
    <path d="M30 78c4-2 6-2 8 0"/>
    <path d="M130 78c-4-2-6-2-8 0"/>
  </g>
  <g fill="#a63d3d" opacity="0.4">
    <circle cx="28" cy="88" r="2"/>
    <circle cx="132" cy="88" r="2"/>
  </g>
</svg>
