    <circle cx="1220" cy="180" r="52"/><circle cx="1220" cy="180" r="30"/>
    <circle cx="180" cy="1220" r="52"/><circle cx="180" cy="1220" r="30"/>
    <circle cx="1220" cy="1220" r="52"/><circle cx="1220" cy="1220" r="30"/>
