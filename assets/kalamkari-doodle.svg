    <path d="M700 1000 C600 960 520 900 470 820"/>
    <path d="M700 1000 C800 960 880 900 930 820"/>
    <path d="M700 900 C580 860 500 780 470 680"/>
    <path d="M700 900 C820 860 900 780 930 680"/>
