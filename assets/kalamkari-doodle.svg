<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" fill="none">
  <!--
    Elegant Kalamkari tile
    Tirumala Namam (Vaishnava U) + Kalahasti Shiva Tripundra
    Soft enough for backgrounds, clear as sacred motif
  -->
  <defs>
    <linearGradient id="namaIvory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="vibhuti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="100%" stop-color="#e8dfd0"/>
    </linearGradient>
  </defs>

  <!-- Delicate kalamkari border -->
