    <rect x="0" y="38" width="200" height="16" rx="5" fill="url(#vibhuti)"/>
    <rect x="0" y="68" width="200" height="16" rx="5" fill="url(#vibhuti)"/>
    <circle cx="100" cy="46" r="11" fill="#9c2f2f" fill-opacity="0.65"/>
