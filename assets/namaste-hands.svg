<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <!-- NAMASTHE — clear praying-hands icon, Kalamkari gold palette -->
  <defs>
    <linearGradient id="ntRing" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8d08a"/>
      <stop offset="1" stop-color="#b8923f"/>
    </linearGradient>
    <linearGradient id="ntPalm" x1="64" y1="28" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5e0c4"/>
      <stop offset="1" stop-color="#c9956a"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <circle cx="64" cy="64" r="58" stroke="url(#ntRing)" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" stroke="#8b2e2e" stroke-width="1" opacity="0.4"/>

  <!-- Left hand -->
  <path
    fill="url(#ntPalm)"
    stroke="#c4a35a"
    stroke-width="1.6"
    stroke-linejoin="round"
    d="M42 98
       c-6-10-8-24-6-38
       c1-10 5-18 11-24
       c3-3 7-1 7 3
       v38
       c0 8-4 16-12 21z"
  />
  <!-- Left fingers (4) -->
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M48 40 c-1-10 1-18 6-24 c2.2-2.5 5.5-.5 5.5 2.5 V58 c0 2-1.5 3.5-3.5 3.5 h-4 c-2 0-4-1.5-4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M54 36 c0-11 2-19 7-26 c2-2.8 5.5-.8 5.5 2.5 V56 c0 2-1.5 3.5-3.5 3.5 h-5 c-2 0-4-1.5-4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M60 34 c1-11 3-19 8-26 c2-2.6 5.2-.6 5.2 2.6 V54 c0 2-1.5 3.5-3.5 3.5 h-5.7 c-2 0-4-1.5-4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.3" stroke-linejoin="round"
    d="M50 58 c-6-2-10-8-10-14 c0-3 2.5-4.5 5-3.5 3 1.2 6 5 7 10z"/>

  <!-- Right hand (mirror) -->
  <path
    fill="url(#ntPalm)"
    stroke="#c4a35a"
    stroke-width="1.6"
    stroke-linejoin="round"
    d="M86 98
       c6-10 8-24 6-38
       c-1-10-5-18-11-24
       c-3-3-7-1-7 3
       v38
       c0 8 4 16 12 21z"
  />
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M80 40 c1-10-1-18-6-24 c-2.2-2.5-5.5-.5-5.5 2.5 V58 c0 2 1.5 3.5 3.5 3.5 h4 c2 0 4-1.5 4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M74 36 c0-11-2-19-7-26 c-2-2.8-5.5-.8-5.5 2.5 V56 c0 2 1.5 3.5 3.5 3.5 h5 c2 0 4-1.5 4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.4" stroke-linejoin="round"
    d="M68 34 c-1-11-3-19-8-26 c-2-2.6-5.2-.6-5.2 2.6 V54 c0 2 1.5 3.5 3.5 3.5 h5.7 c2 0 4-1.5 4-3.5z"/>
  <path fill="url(#ntPalm)" stroke="#c4a35a" stroke-width="1.3" stroke-linejoin="round"
    d="M78 58 c6-2 10-8 10-14 c0-3-2.5-4.5-5-3.5-3 1.2-6 5-7 10z"/>

  <!-- Center join -->
  <path d="M64 38 V96" stroke="#8b2e2e" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Gold bangles -->
  <path d="M40 90c6 6 16 9 24 9" stroke="#dfc07a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M88 90c-6 6-16 9-24 9" stroke="#dfc07a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Tiny lotus above -->
  <path d="M64 22c-3 3-3 7 0 10 3-3 3-7 0-10z" fill="#dfc07a" opacity="0.9"/>
  <path d="M58 26c-1-4 1-7 4-8M70 26c1-4-1-7-4-8" stroke="#dfc07a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>
